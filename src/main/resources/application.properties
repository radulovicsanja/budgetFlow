spring.application.name=budgetFlow
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/budget_flow
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
# lokalna Postgres lozinka — ne commitaj pravu lozinku
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.open-in-view=true

jwt.secret=BudgetFlowSecretKey_32chars_OK_2026
jwt.expiration-ms=86400000

budgetflow.mail.enabled=false
budgetflow.mail.from=budgetflow@localhost
